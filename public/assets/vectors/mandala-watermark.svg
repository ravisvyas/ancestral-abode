<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <radialGradient id="mandalaGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C89B3C" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#B4532A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C89B3C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Concentric sacred geometry jaali -->
  <circle cx="300" cy="300" r="280" stroke="url(#mandalaGold)" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="300" cy="300" r="250" stroke="#C89B3C" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="300" cy="300" r="200" stroke="#B4532A" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="300" cy="300" r="150" stroke="#C89B3C" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="300" cy="300" r="90" stroke="#B4532A" stroke-width="0.8" stroke-opacity="0.2"/>
  <circle cx="300" cy="300" r="40" stroke="#C89B3C" stroke-width="1" stroke-opacity="0.35"/>

  <!-- 16-petal lotus rosettes -->
  <g stroke="#C89B3C" stroke-width="0.75" stroke-opacity="0.22" fill="none">
    <path d="M300 150 Q320 220 300 300 Q280 220 300 150 Z"/>
    <path d="M300 450 Q320 380 300 300 Q280 380 300 450 Z"/>
    <path d="M150 300 Q220 320 300 300 Q220 280 150 300 Z"/>
    <path d="M450 300 Q380 320 300 300 Q380 280 450 300 Z"/>
    <!-- 45-degree diagonals -->
    <path d="M194 194 Q250 220 300 300 Q220 250 194 194 Z"/>
    <path d="M406 406 Q350 380 300 300 Q380 350 406 406 Z"/>
    <path d="M406 194 Q380 250 300 300 Q350 220 406 194 Z"/>
    <path d="M194 406 Q220 350 300 300 Q250 380 194 406 Z"/>
  </g>

  <!-- Ornate scalloped outer rim -->
  <g stroke="#B4532A" stroke-width="0.6" stroke-opacity="0.18">
    <circle cx="300" cy="300" r="235" stroke-dasharray="2 8"/>
    <circle cx="300" cy="300" r="115" stroke-dasharray="1 5"/>
  </g>
</svg>
