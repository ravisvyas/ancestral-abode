<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="cfTitle cfDesc" fill="none">
  <title id="cfTitle">Corner flourish</title>
  <desc>Traditional Indian filigree corner bracket with a spiral volute, a paisley bud and a beaded rule.</desc>

  <defs>
    <linearGradient id="cfGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFB76C"/>
      <stop offset="60%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#8C3A16"/>
    </linearGradient>
  </defs>

  <!-- outer rules -->
  <path d="M4 44V4h40" stroke="url(#cfGold)" stroke-width="2.2" stroke-linecap="square"/>
  <path d="M14 44V14h30" stroke="url(#cfGold)" stroke-width="1.1" stroke-linecap="square" opacity="0.75"/>

  <!-- beaded rule -->
  <g fill="url(#cfGold)">
    <circle cx="22" cy="8.5" r="1.7"/>
    <circle cx="30" cy="8.5" r="1.7"/>
    <circle cx="38" cy="8.5" r="1.7"/>
    <circle cx="8.5" cy="22" r="1.7"/>
    <circle cx="8.5" cy="30" r="1.7"/>
    <circle cx="8.5" cy="38" r="1.7"/>
  </g>

  <!-- main volute scroll -->
  <path d="M18 44c0-15 11-26 26-26" stroke="url(#cfGold)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M18 44c-6 0-10-4-10-10s4-10 10-10" stroke="url(#cfGold)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M18 24c0-5 4-9 9-9s9 4 9 9-4 9-9 9-9-4-9-9Z" stroke="url(#cfGold)" stroke-width="1.8" fill="none"/>
  <circle cx="27" cy="24" r="2.4" fill="url(#cfGold)"/>

  <!-- paisley bud sweeping down the leg -->
  <path d="M44 18c14 0 20 10 20 22s-8 20-20 20" stroke="url(#cfGold)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M46 26c8 0 11 6 11 14s-4 13-11 13-12-5-12-13 4-14 12-14Z" stroke="url(#cfGold)" stroke-width="1.5" fill="none" opacity="0.9"/>
  <path d="M46 34c4 0 6 3 6 7s-3 8-7 8-7-3-7-7 3-8 8-8Z" fill="url(#cfGold)" opacity="0.28"/>

  <!-- teardrop finial -->
  <path d="M27 44c4 0 7 3 7 7s-4 7-8 7-7-3-7-7 3-7 8-7Z" stroke="url(#cfGold)" stroke-width="1.6" fill="none"/>
  <circle cx="26" cy="51" r="1.9" fill="url(#cfGold)"/>

  <!-- filigree tendrils -->
  <g stroke="url(#cfGold)" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <path d="M36 30c8-2 12-8 12-14"/>
    <path d="M30 36c-8 2-14 0-18-6"/>
    <path d="M52 46c4 8 10 12 18 12"/>
  </g>
  <g fill="url(#cfGold)" opacity="0.75">
    <circle cx="48" cy="14" r="1.5"/>
    <circle cx="11" cy="29" r="1.5"/>
    <circle cx="71" cy="58" r="1.5"/>
  </g>
</svg>
