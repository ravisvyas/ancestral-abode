<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-label="Ethnic frieze border with chevron spikes, dots and wave lines" fill="none">
  <title>Ethnic frieze border</title>
  <desc>A horizontally tiling ornamental band of chevron spikes, bead dots and wave rules.</desc>

  <defs>
    <linearGradient id="ebGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B4532A"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#B4532A"/>
    </linearGradient>
    <g id="ebUnit">
      <!-- wave rules -->
      <path d="M0 10c10-6 20 6 30 0s20 6 30 0 20 6 30 0 20 6 30 0 20 6 30 0 20 6 30 0 20 6 30 0" stroke="url(#ebGold)" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
      <path d="M0 54c10-6 20 6 30 0s20 6 30 0 20 6 30 0 20 6 30 0 20 6 30 0 20 6 30 0 20 6 30 0" stroke="url(#ebGold)" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

      <!-- chevron spikes -->
      <path d="M15 32 30 18l15 14-15 14-15-14Z" stroke="url(#ebGold)" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M30 22 40 32 30 42 20 32l10-10Z" fill="url(#ebGold)" opacity="0.32"/>

      <!-- bead dots -->
      <circle cx="75" cy="32" r="3.4" fill="url(#ebGold)"/>
      <circle cx="87" cy="32" r="1.9" fill="url(#ebGold)" opacity="0.75"/>

      <!-- half chevron towards the next unit -->
      <path d="M105 32 120 18l15 14-15 14-15-14Z" stroke="url(#ebGold)" stroke-width="1.7" stroke-linejoin="round" transform="translate(30 0)"/>
      <path d="M150 32 165 18l15 14-15 14-15-14Z" stroke="url(#ebGold)" stroke-width="1.7" stroke-linejoin="round"/>

      <!-- small pendant drop -->
      <path d="M135 40l7 8 7-8" stroke="url(#ebGold)" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>

      <!-- dotted rule beneath the wave -->
      <g fill="url(#ebGold)" opacity="0.65">
        <circle cx="10" cy="24" r="1.3"/>
        <circle cx="40" cy="24" r="1.3"/>
        <circle cx="70" cy="24" r="1.3"/>
        <circle cx="100" cy="24" r="1.3"/>
        <circle cx="130" cy="24" r="1.3"/>
        <circle cx="160" cy="24" r="1.3"/>
        <circle cx="190" cy="24" r="1.3"/>
        <circle cx="220" cy="24" r="1.3"/>
        <circle cx="10" cy="40" r="1.3"/>
        <circle cx="40" cy="40" r="1.3"/>
        <circle cx="70" cy="40" r="1.3"/>
        <circle cx="100" cy="40" r="1.3"/>
        <circle cx="130" cy="40" r="1.3"/>
        <circle cx="160" cy="40" r="1.3"/>
        <circle cx="190" cy="40" r="1.3"/>
        <circle cx="220" cy="40" r="1.3"/>
      </g>
    </g>
  </defs>

  <use href="#ebUnit"/>
</svg>
