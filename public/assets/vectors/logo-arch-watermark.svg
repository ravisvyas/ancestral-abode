<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 516" width="440" height="516" fill="none">
  <!-- Subtle royal watermark mirroring Ancestral Abode Logo Design -->
  <g stroke="#B4532A" stroke-opacity="0.18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer cusped multi-foil arch contour -->
    <path d="M40 500 V230 C40 140 100 80 180 40 C195 32 245 32 260 40 C340 80 400 140 400 230 V500" stroke-width="2"/>
    
    <!-- Outer arch stepped lobes -->
    <path d="M60 500 V235 C60 160 115 105 185 70 C205 60 235 60 255 70 C325 105 380 160 380 235 V500" stroke-dasharray="4 4"/>

    <!-- Concentric sun target rosette at the apex -->
    <circle cx="220" cy="50" r="26" stroke="#C89B3C" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="220" cy="50" r="16" stroke="#B4532A" stroke-width="1.2"/>
    <circle cx="220" cy="50" r="8" fill="#C89B3C" fill-opacity="0.2"/>
    <circle cx="220" cy="50" r="3" fill="#B4532A" fill-opacity="0.3"/>

    <!-- Radial bracket arcs at apex -->
    <path d="M182 50 C182 30 195 24 195 24" stroke="#C89B3C"/>
    <path d="M258 50 C258 30 245 24 245 24" stroke="#C89B3C"/>

    <!-- Central royal chhatri dome & pavilion -->
    <!-- Dome -->
    <path d="M220 180 C210 215 190 230 220 255 C250 230 230 215 220 180 Z" fill="#B4532A" fill-opacity="0.15" stroke-width="1.5"/>
    <path d="M220 165 V180" stroke="#C89B3C" stroke-width="2"/>
    <circle cx="220" cy="164" r="2.5" fill="#C89B3C"/>

    <!-- Dome base cornice -->
    <rect x="175" y="255" width="90" height="8" rx="2" fill="#C89B3C" fill-opacity="0.2" stroke-width="1"/>
    
    <!-- 3 Arched doorways of the haveli pavilion -->
    <path d="M185 350 V285 C185 272 195 268 200 268 C205 268 215 272 215 285 V350" stroke-width="1.5"/>
    <path d="M210 350 V280 C210 265 220 263 220 263 C220 263 230 265 230 280 V350" stroke-width="1.8"/>
    <path d="M225 350 V285 C225 272 235 268 240 268 C245 268 255 272 255 285 V350" stroke-width="1.5"/>

    <!-- Plinth base -->
    <rect x="165" y="350" width="110" height="10" rx="1" fill="#B4532A" fill-opacity="0.15"/>
    <rect x="155" y="360" width="130" height="8" rx="1" stroke="#C89B3C"/>

    <!-- Side panel chevron leaf fronds (left side) -->
    <g stroke="#C89B3C" stroke-width="1.2" stroke-opacity="0.22">
      <path d="M100 260 L80 280 M100 290 L80 310 M100 320 L80 340 M100 350 L80 370"/>
      <path d="M100 260 L120 280 M100 290 L120 310 M100 320 L120 340 M100 350 L120 370"/>
      <line x1="100" y1="250" x2="100" y2="400"/>
    </g>

    <!-- Side panel chevron leaf fronds (right side) -->
    <g stroke="#C89B3C" stroke-width="1.2" stroke-opacity="0.22">
      <path d="M340 260 L320 280 M340 290 L320 310 M340 320 L320 340 M340 350 L320 370"/>
      <path d="M340 260 L360 280 M340 290 L360 310 M340 320 L360 340 M340 350 L360 370"/>
      <line x1="340" y1="250" x2="340" y2="400"/>
    </g>

    <!-- Corner concentric sun rosettes -->
    <circle cx="100" cy="445" r="16" stroke="#B4532A" stroke-width="1.2"/>
    <circle cx="100" cy="445" r="8" fill="#C89B3C" fill-opacity="0.2"/>
    <circle cx="340" cy="445" r="16" stroke="#B4532A" stroke-width="1.2"/>
    <circle cx="340" cy="445" r="8" fill="#C89B3C" fill-opacity="0.2"/>

    <!-- Bottom wavy water ripples -->
    <path d="M150 430 Q170 420 190 430 T230 430 T270 430 T290 430" stroke="#B4532A" stroke-width="1.5"/>
    <path d="M150 445 Q170 435 190 445 T230 445 T270 445 T290 445" stroke="#C89B3C" stroke-width="1.2"/>
  </g>
</svg>
