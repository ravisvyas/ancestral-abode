<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Property Photos Catalog</title>
<style>
body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: #2a2a2a; border-radius: 8px; overflow: hidden; padding: 8px; }
img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
.name { font-size: 13px; font-weight: bold; margin-top: 6px; word-break: break-all; }
</style>
</head>
<body>
<h1>Ancestral Abode — Raw Photos Catalog</h1>
<div class="grid" id="gallery"></div>
<script>
const photos = [
  "35a2672_thumb.jpg", "35a2685_thumb.jpg", "35a2692_thumb.jpg", "35a2697-1_thumb.jpg",
  "35a2697_thumb.jpg", "35a2703-1_thumb.jpg", "35a2703_thumb.jpg", "35a2709_thumb.jpg",
  "35a2712_thumb.jpg", "35a2715_thumb.jpg", "35a2725_thumb.jpg", "35a2730_thumb.jpg",
  "35a2733_thumb.jpg", "35a2738_thumb.jpg", "35a2742_thumb.jpg", "35a2756_thumb.jpg",
  "35a2762_thumb.jpg", "35a2777_thumb.jpg", "35a2785_thumb.jpg", "35a2789_thumb.jpg",
  "35a2792_thumb.jpg", "35a2798_thumb.jpg", "35a2806_thumb.jpg", "35a2809_thumb.jpg",
  "whatsapp-image-2025-11-10-at-73121-pm-1_thumb.jpg", "whatsapp-image-2025-11-10-at-73121-pm_thumb.jpg",
  "whatsapp-image-2025-11-10-at-73122-pm-1_thumb.jpg", "whatsapp-image-2025-11-10-at-73345-pm_thumb.jpg"
];
const container = document.getElementById('gallery');
photos.forEach(p => {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<img src="/assets/property_thumbs/${p}"><div class="name">${p.replace('_thumb.jpg', '')}</div>`;
  container.appendChild(d);
});
</script>
</body>
</html>
